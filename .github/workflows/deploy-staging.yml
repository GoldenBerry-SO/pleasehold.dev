name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/worker/**"
      - "packages/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # A public repo's GITHUB_TOKEN cannot create org packages, so log in with the
      # PiXeL16 PAT (the same one the cluster pulls with), which can.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: PiXeL16
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/goldenberry-so/pleasehold/api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/GoldenBerry-SO/pleasehold.dev

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/goldenberry-so/pleasehold/web:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/GoldenBerry-SO/pleasehold.dev
          build-args: VITE_API_URL=

      - name: Build & push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/goldenberry-so/pleasehold/worker:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/GoldenBerry-SO/pleasehold.dev

  notify-deploy-start:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord of deploy start
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"🚀 pleasehold Deploy Started\",\"description\":\"Deploying commit \`${GITHUB_SHA::7}\` to **production**\",\"color\":3447003,\"fields\":[{\"name\":\"Triggered by\",\"value\":\"${{ github.actor }}\",\"inline\":true},{\"name\":\"Workflow\",\"value\":\"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",\"inline\":true}]}]}" \
            "$DISCORD_WEBHOOK_URL"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GoldenBerry-SO/infra
          # A write deploy key on GoldenBerry-SO/infra, usable only by pushes to main here
          # (workflow secrets never reach fork PRs on this public repo).
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          ref: main

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update all 3 image tags
        working-directory: k8s/apps/pleasehold
        run: |
          kustomize edit set image \
            api=ghcr.io/goldenberry-so/pleasehold/api:${{ needs.build.outputs.tag }} \
            web=ghcr.io/goldenberry-so/pleasehold/web:${{ needs.build.outputs.tag }} \
            worker=ghcr.io/goldenberry-so/pleasehold/worker:${{ needs.build.outputs.tag }}

      - name: Commit and push with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/pleasehold/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "deploy: pleasehold production → ${{ needs.build.outputs.tag }}"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Retry $attempt..."
            git pull --rebase
          done
          exit 1

  notify-deploy-success:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Notify Discord of deploy success
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"✅ pleasehold Deploy Succeeded\",\"description\":\"Commit \`${GITHUB_SHA::7}\` is live on **staging**\",\"color\":3066993,\"fields\":[{\"name\":\"Triggered by\",\"value\":\"${{ github.actor }}\",\"inline\":true},{\"name\":\"Workflow\",\"value\":\"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",\"inline\":true}]}]}" \
            "$DISCORD_WEBHOOK_URL"

  notify-deploy-failure:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Notify Discord of deploy failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ pleasehold Deploy Failed\",\"description\":\"Deploy of commit \`${GITHUB_SHA::7}\` to **production** failed\",\"color\":15158332,\"fields\":[{\"name\":\"Triggered by\",\"value\":\"${{ github.actor }}\",\"inline\":true},{\"name\":\"Workflow\",\"value\":\"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",\"inline\":true}]}]}" \
            "$DISCORD_WEBHOOK_URL"
